# Sample docker-compose file to run Kanboard (Node.js) with MariaDB
name: kanboard
services:
  app:
    image: ${KANBOARD_IMAGE:-kanboard/kanboard:latest}
    container_name: kanboard
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER: mysql
      DB_HOSTNAME: db
      DB_PORT: "3306"
      DB_NAME: kanboard
      DB_USERNAME: kanboard
      DB_PASSWORD: kanboard-secret
      DB_RUN_MIGRATIONS: "true"
    volumes:
      - data:/app/data
      - plugins:/app/plugins
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:lts
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: kanboard
      MYSQL_USER: kanboard
      MYSQL_PASSWORD: kanboard-secret
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
    driver: local
  plugins:
    driver: local
  db:
    driver: local
