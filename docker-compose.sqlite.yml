# Sample docker-compose file to run Kanboard (Node.js) with SQLite
name: kanboard
services:
  app:
    image: ${KANBOARD_IMAGE:-kanboard/kanboard:latest}
    container_name: kanboard
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER: sqlite
      DB_FILENAME: /app/data/db.sqlite
      DB_RUN_MIGRATIONS: "true"
    volumes:
      - data:/app/data
      - plugins:/app/plugins
volumes:
  data:
    driver: local
  plugins:
    driver: local
