# Sample docker-compose file to run Kanboard (Node.js) with PostgreSQL
name: kanboard
services:
  app:
    image: ${KANBOARD_IMAGE:-kanboard/kanboard:latest}
    container_name: kanboard
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER: postgres
      DB_HOSTNAME: db
      DB_PORT: "5432"
      DB_NAME: kanboard
      DB_USERNAME: kanboard
      DB_PASSWORD: kanboard-secret
      DB_RUN_MIGRATIONS: "true"
    volumes:
      - data:/app/data
      - plugins:/app/plugins
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: kanboard
      POSTGRES_PASSWORD: kanboard-secret
      POSTGRES_DB: kanboard
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanboard -d kanboard"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
    driver: local
  plugins:
    driver: local
  db:
    driver: local
